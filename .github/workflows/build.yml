name: EXE bauen

# Bei jedem Push auf main wird die .exe gebaut.
# Steht in version.py eine Versionsnummer, für die es noch kein Release gibt,
# wird automatisch ein Release (z. B. v1.1.0) mit der .exe erstellt.
# Sonst ist die .exe nur als Test-Build unter "Actions" -> Lauf -> "Artifacts" verfügbar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version lesen und prüfen, ob es schon ein Release gibt
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "from version import __version__; print(__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            "release=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release v$v existiert schon - nur Test-Build"
          } else {
            "release=true" >> $env:GITHUB_OUTPUT
            Write-Host "Neues Release v$v wird erstellt"
          }
          exit 0

      - name: PyInstaller installieren
        run: python -m pip install --upgrade pip pyinstaller

      - name: EXE bauen
        run: python -m PyInstaller --onefile --noconsole --name Download-Sortierer --clean app.py

      - name: Als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Download-Sortierer-${{ steps.ver.outputs.version }}
          path: dist/Download-Sortierer.exe

      - name: Release erstellen
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Download-Sortierer ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/Download-Sortierer.exe
          generate_release_notes: true
