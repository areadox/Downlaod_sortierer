name: EXE bauen

# Läuft bei jedem Push auf main (Test-Build zum Herunterladen unter "Actions")
# und bei einem Versions-Tag wie v1.2.0 (dann wird ein Release mit der .exe erstellt).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version aus Tag setzen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content version.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content version.py
          Get-Content version.py

      - name: PyInstaller installieren
        run: python -m pip install --upgrade pip pyinstaller

      - name: EXE bauen
        run: python -m PyInstaller --onefile --noconsole --name Download-Sortierer --clean app.py

      - name: Als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Download-Sortierer
          path: dist/Download-Sortierer.exe

      - name: Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Download-Sortierer.exe
          generate_release_notes: true
